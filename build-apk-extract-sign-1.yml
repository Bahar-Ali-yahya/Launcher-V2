name: Build HyperLauncher from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f \( -iname '*.zip' \) | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "::error::Aucun fichier ZIP trouvé. Place ton ZIP à la racine du dépôt."
            exit 1
          fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "ZIP trouvé: $ZIP"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

          # If the ZIP contains a single top-level folder, use it as project root.
          ROOT="project"
          COUNT="$(find project -mindepth 1 -maxdepth 1 -type d | wc -l)"
          FILES="$(find project -mindepth 1 -maxdepth 1 -type f | wc -l)"
          if [ "$COUNT" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            ROOT="$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Projet: $ROOT"

      - name: Validate Android/Gradle project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "::error::settings.gradle ou settings.gradle.kts introuvable."
            exit 1
          fi
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "::error::build.gradle ou build.gradle.kts introuvable."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          elif [ -f "gradlew.bat" ]; then
            echo "::error::Le wrapper Windows gradlew.bat est présent mais pas gradlew Linux."
            exit 1
          else
            echo "::error::gradlew absent du ZIP. Ajoute le Gradle Wrapper au projet pour une compilation fiable."
            exit 1
          fi

          "$GRADLE" --version
          "$GRADLE" clean assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Create signing keystore for CI
        shell: bash
        run: |
          set -e
          keytool -genkeypair \
            -alias hyperlauncher \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore "$RUNNER_TEMP/hyperlauncher.keystore" \
            -storepass android \
            -keypass android \
            -dname "CN=HyperLauncher, OU=Mobile, O=HyperLauncher, L=Garoua, ST=North, C=CM" \
            -noprompt
          echo "KEYSTORE=$RUNNER_TEMP/hyperlauncher.keystore" >> "$GITHUB_ENV"

      - name: Sign release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"

          # Locate an unsigned release APK.
          APK="$(find . -type f -path '*/build/outputs/apk/release/*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Aucun APK release trouvé."
            exit 1
          fi

          SDK="$ANDROID_HOME"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$SDK/build-tools" -type f -name zipalign | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then
            echo "::error::Android Build Tools/apksigner introuvable."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/signed"

          "$ZIPALIGN" -f 4 "$APK" "$RUNNER_TEMP/signed/aligned.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias hyperlauncher \
            --out "$RUNNER_TEMP/signed/HyperLauncher-signed-release.apk" \
            "$RUNNER_TEMP/signed/aligned.apk"

          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/signed/HyperLauncher-signed-release.apk"

      - name: Collect APKs
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          find "$PROJECT_ROOT" -type f -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/HyperLauncher-debug.apk" \; -quit || true

          cp "$RUNNER_TEMP/signed/HyperLauncher-signed-release.apk" \
             "$GITHUB_WORKSPACE/artifacts/HyperLauncher-signed-release.apk"

          echo "=== APK disponibles ==="
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HyperLauncher-APKs
          path: artifacts/*.apk
          if-no-files-found: error
