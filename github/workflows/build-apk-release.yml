name: Build APK & ZIP Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "❌ No ZIP found"
            exit 1
          fi
          echo "✅ Found: $ZIP"
          unzip -q "$ZIP"
          ls -la

      - name: Find project folder
        run: |
          PROJ=$(find . -maxdepth 1 -type d -name "*[Rr]edmi*" -o -name "*[Ll]auncher*" 2>/dev/null | head -1)
          if [ -z "$PROJ" ]; then
            echo "❌ No project folder found"
            ls -la
            exit 1
          fi
          echo "✅ Project: $PROJ"
          echo "PROJ=$PROJ" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Package ZIP
        run: |
          cd "$PROJ"
          mkdir -p pkg
          cp app/build/outputs/apk/release/*.apk pkg/ 2>/dev/null || true
          
          cat > pkg/INSTALL.txt << 'EOF'
Redmi A5 HyperLauncher V2
=========================
Installation: Copy APK to your device and install
Support: https://github.com/Bahar-Ali-yahya/Launcher-V2
EOF
          
          cd pkg
          zip -r ../HyperLauncher.zip *
          cd ..
          ls -lh HyperLauncher.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: "${{ env.PROJ }}/app/build/outputs/apk/release/*.apk"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: "${{ env.PROJ }}/HyperLauncher.zip"
