name: Build SimAOD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le zip du projet a été uploadé tel quel dans le repo (pas dézippé) :
      # on l'extrait nous-mêmes avant de lancer Gradle, pour ne pas avoir à
      # dézipper/uploader les fichiers un par un.
      - name: Extraire le zip du projet
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Aucun fichier .zip trouvé à la racine du repo."
            exit 1
          fi
          echo "Zip trouvé : $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d _extracted
          SRC_DIR=$(find _extracted -maxdepth 1 -mindepth 1 -type d | head -n1)
          if [ -z "$SRC_DIR" ]; then
            echo "Le zip ne contient aucun dossier."
            exit 1
          fi
          echo "Contenu du projet dans : $SRC_DIR"
          cp -r "$SRC_DIR"/. .
          rm -rf _extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # On n'utilise volontairement PAS ./gradlew ici : un gradle-wrapper.jar
      # manquant ou corrompu dans le zip est une cause fréquente d'échec de
      # compilation en CI. setup-gradle installe Gradle lui-même, donc aucun
      # binaire wrapper à transporter/committer.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Build "debug" : signé automatiquement par Gradle, installable direct sur
      # ton téléphone. Pas de secrets à configurer, usage perso uniquement.
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimAOD-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
