name: Build SimAOD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le projet est toujours à la racine du repo : pas de "find -iname" fragile.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # On n'utilise volontairement PAS ./gradlew ici : un gradle-wrapper.jar
      # manquant ou corrompu dans le zip est une cause fréquente d'échec de
      # compilation en CI. setup-gradle installe Gradle lui-même, donc aucun
      # binaire wrapper à transporter/committer.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Build "debug" : signé automatiquement par Gradle, installable direct sur
      # ton téléphone. Pas de secrets à configurer, usage perso uniquement.
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimAOD-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
